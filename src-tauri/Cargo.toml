[package]
name = "flip"
version = "0.1.0"
description = "FLIP for macOS — Liquid Glass radial file converter & Create New utility"
authors = ["The Tiny Foundry"]
license = "MIT"
edition = "2021"

[lib]
name = "flip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }
quick-xml = "0.37"
csv = "1"
pulldown-cmark = "0.12"
image = "0.25"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs = "5"
tokio = { version = "1", features = ["full"] }
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry"] }

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
